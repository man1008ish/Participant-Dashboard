# Application Configuration
spring.application.name=participant-dashboard
server.port=8080

# ================================================
# DATABASE CONFIGURATION
# ================================================

# Option 1: H2 Database (In-Memory) - DEFAULT
# Uncomment these lines to use H2 (No installation required)
#spring.datasource.url=jdbc:h2:mem:trainingdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Option 2: MySQL Database - PRODUCTION
# Comment out H2 configuration above and uncomment these lines
 spring.datasource.url=jdbc:mysql://localhost:3306/training_db?createDatabaseIfNotExist=true
 spring.datasource.username=root
 spring.datasource.password=root
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================
# HIBERNATE/JPA CONFIGURATION
# ================================================

# DDL auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Fix for MySQL SEQUENCES error with Hibernate 6.x
# This tells Hibernate to use IDENTITY instead of SEQUENCE for MySQL
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy

# Additional Hibernate properties for MySQL compatibility
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Connection pool settings (optional but recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ================================================
# EMAIL CONFIGURATION
# ================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application specific properties
app.email.from=noreply@trainingprogram.com
app.email.enabled=false

# ================================================
# LOGGING CONFIGURATION
# ================================================

logging.level.com.training=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ================================================
# ADDITIONAL SETTINGS
# ================================================

# Disable Open EntityManager in View (to avoid lazy loading issues)
spring.jpa.open-in-view=false

# Set timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC